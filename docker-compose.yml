services:
  mosquitto:
    image: eclipse-mosquitto:2.0.20
    volumes:
      - ./docker/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    ports:
      - "127.0.0.1:1883:1883"

  gateway:
    build:
      context: .
      dockerfile: docker/Dockerfile.gateway
    environment:
      VIBRASENSE_DB: /tmp/vibrasense.db
      VIBRASENSE_HOST: 0.0.0.0
      MQTT_BROKER: mosquitto
    ports:
      - "127.0.0.1:5000:5000"
    depends_on:
      - mosquitto
    command: ["python", "software/app.py"]

  tester:
    build:
      context: .
      dockerfile: docker/Dockerfile.gateway
    environment:
      VIBRASENSE_DB: /tmp/vibrasense-test.db
      MQTT_BROKER: mosquitto
    depends_on:
      - mosquitto
    command: ["python", "-m", "pytest", "-q"]

  firmware-build:
    profiles: ["firmware"]
    build:
      context: .
      dockerfile: docker/Dockerfile.firmware
    command: ["pio", "run", "-d", "firmware/vibrasense_node"]
